<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom Wordle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121213;
            color: #ffffff;
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            touch-action: manipulation;
        }

        .tile {
            width: 100%;
            height: 100%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            line-height: 2rem;
            font-weight: bold;
            vertical-align: middle;
            box-sizing: border-box;
            color: white;
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.15s ease, background-color 0.4s ease, border-color 0.4s ease;
        }

        /* Default empty tile */
        .tile[data-state="empty"] {
            border: 2px solid #3a3a3c;
        }

        /* Tile with a letter before submit */
        .tile[data-state="tbd"] {
            border: 2px solid #565758;
            animation: popIn 0.1s ease-in-out;
        }

        /* Evaluated tiles */
        .tile[data-state="correct"] {
            background-color: #538d4e;
            border: 2px solid #538d4e;
        }

        .tile[data-state="present"] {
            background-color: #b59f3b;
            border: 2px solid #b59f3b;
        }

        .tile[data-state="absent"] {
            background-color: #3a3a3c;
            border: 2px solid #3a3a3c;
        }

        /* Flip animation for submitting */
        .tile[data-animation="flip-in"] {
            animation: flipIn 0.25s ease-in forwards;
        }

        .tile[data-animation="flip-out"] {
            animation: flipOut 0.25s ease-in forwards;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            40% { transform: scale(1.1); opacity: 1; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes flipIn {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipOut {
            0% { transform: rotateX(-90deg); }
            100% { transform: rotateX(0deg); }
        }
        
        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }
        
        .row.shake {
            animation: shake 0.5s;
        }

        /* Keyboard styles */
        .key {
            font-family: inherit;
            font-weight: bold;
            border: 0;
            padding: 0;
            height: 58px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            background-color: #818384;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            transition: background-color 0.1s ease;
        }

        .key:active {
            background-color: #565758;
        }

        .key[data-state="correct"] { background-color: #538d4e; }
        .key[data-state="present"] { background-color: #b59f3b; }
        .key[data-state="absent"] { background-color: #3a3a3c; }

        .key-wide { width: 65px; font-size: 12px;}
        .key-normal { flex: 1; font-size: 1.25rem;}

        /* Setup input styling */
        #setup-input {
            letter-spacing: 0.5em;
            text-transform: uppercase;
        }
        
        #toast-container {
            pointer-events: none;
        }

        .toast-message {
            background-color: white;
            color: black;
            padding: 12px 16px;
            border-radius: 4px;
            font-weight: bold;
            opacity: 1;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 8px;
        }
        
        .toast-message.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-between overflow-hidden">

    <!-- SETUP VIEW -->
    <div id="setup-view" class="w-full h-full flex flex-col items-center justify-center p-4 absolute top-0 left-0 bg-[#121213] z-50">
        <h1 class="text-4xl font-extrabold mb-2 tracking-wider text-center">CUSTOM<br>WORDLE</h1>
        <p class="text-gray-400 mb-8 text-center text-sm max-w-xs">Player 1: Set a 5-letter word for Player 2 to guess.</p>
        
        <div class="w-full max-w-sm flex flex-col gap-4">
            <input type="text" id="setup-input" maxlength="5" autocomplete="off" spellcheck="false"
                class="w-full bg-[#121213] border-2 border-[#565758] rounded-md py-4 text-center text-3xl font-bold focus:outline-none focus:border-white transition-colors"
                placeholder="-----">
            
            <p id="setup-error" class="text-red-400 text-center h-6 font-semibold opacity-0 transition-opacity"></p>
            
            <button id="start-btn" 
                class="w-full py-4 bg-[#818384] text-white font-bold rounded-md cursor-not-allowed opacity-50 transition-all text-xl" disabled>
                START GAME
            </button>
        </div>
    </div>

    <!-- GAME HEADER -->
    <header class="flex w-full max-w-lg items-center justify-between px-4 py-3 border-b border-[#3a3a3c]">
        <div class="w-8"></div>
        <h1 class="font-extrabold text-3xl tracking-wider">WORDLE</h1>
        <button id="reset-btn" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-white transition-colors" title="New Game">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
        </button>
    </header>

    <!-- GAME BOARD -->
    <main class="flex-grow flex items-center justify-center w-full overflow-hidden">
        <div id="board" class="grid grid-rows-6 gap-[5px] p-[10px] w-full max-w-[350px] aspect-[5/6]">
            <!-- Rows injected by JS -->
        </div>
    </main>

    <!-- KEYBOARD -->
    <div id="keyboard" class="w-full max-w-[500px] px-2 pb-8 pt-2 flex flex-col gap-2">
        <div class="flex gap-1.5 justify-center w-full">
            <button class="key key-normal" data-key="q">Q</button>
            <button class="key key-normal" data-key="w">W</button>
            <button class="key key-normal" data-key="e">E</button>
            <button class="key key-normal" data-key="r">R</button>
            <button class="key key-normal" data-key="t">T</button>
            <button class="key key-normal" data-key="y">Y</button>
            <button class="key key-normal" data-key="u">U</button>
            <button class="key key-normal" data-key="i">I</button>
            <button class="key key-normal" data-key="o">O</button>
            <button class="key key-normal" data-key="p">P</button>
        </div>
        <div class="flex gap-1.5 justify-center w-full px-[5%]">
            <button class="key key-normal" data-key="a">A</button>
            <button class="key key-normal" data-key="s">S</button>
            <button class="key key-normal" data-key="d">D</button>
            <button class="key key-normal" data-key="f">F</button>
            <button class="key key-normal" data-key="g">G</button>
            <button class="key key-normal" data-key="h">H</button>
            <button class="key key-normal" data-key="j">J</button>
            <button class="key key-normal" data-key="k">K</button>
            <button class="key key-normal" data-key="l">L</button>
        </div>
        <div class="flex gap-1.5 justify-center w-full">
            <button class="key key-wide" data-key="enter">ENTER</button>
            <button class="key key-normal" data-key="z">Z</button>
            <button class="key key-normal" data-key="x">X</button>
            <button class="key key-normal" data-key="c">C</button>
            <button class="key key-normal" data-key="v">V</button>
            <button class="key key-normal" data-key="b">B</button>
            <button class="key key-normal" data-key="n">N</button>
            <button class="key key-normal" data-key="m">M</button>
            <button class="key key-wide" data-key="backspace">
                <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
                    <path fill="var(--color-tone-1)" d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="absolute top-20 left-0 w-full flex flex-col items-center z-50"></div>

    <script>
        // Minimal valid word list for checking (expanded slightly for better playability)
        const VALID_WORDS = new Set([
            "CIGAR", "REBUT", "SISSY", "HUMPH", "AWAKE", "BLUSH", "FOCAL", "EVADE", "NAVAL", "SERVE",
            "HEATH", "DWARF", "MODEL", "KARMA", "STINK", "GRADE", "QUIET", "BENCH", "ABATE", "FEIGN",
            "MAJOR", "DEATH", "FRESH", "CRUST", "STOOL", "COLON", "ABASE", "MARRY", "REACT", "BATTY",
            "PRIDE", "FLOSS", "HELIX", "CROAK", "STAFF", "PAPER", "UNFED", "WHELP", "TRAWL", "OUTDO",
            "APPLE", "TRAIN", "HOUSE", "MOUSE", "SMILE", "PLANT", "WATER", "LIGHT", "RIGHT", "NIGHT",
            "MIGHT", "FIGHT", "SIGHT", "TIGHT", "GHOST", "TOAST", "ROAST", "COAST", "BOAST", "BEAST",
            "FEAST", "LEAST", "YEAST", "GUEST", "QUEST", "CHEST", "CREST", "BLAST", "TRUST", "RUSTY", 
            "DUSTY", "MUSTY", "GUSTY", "LUSTY", "FAST", "PAST", "LAST", "MAST", "CAST", "VAST", 
            "WEST", "NEST", "PEST", "REST", "TEST", "BEST", "ZEST", "POST", "HOST", "LOST", "COST", 
            "FROST", "WORDS", "WORDY", "WORLD", "HELLO", "SWEET", "HEART", "SMART", "BRAIN", "THINK", 
            "DRINK", "BLINK", "BRING", "THING", "SWING", "STING", "FLING", "SLING", "CLING", "WRING", 
            "SPRING", "STRING", "STRONG", "WRONG", "ALONG", "SONG", "GONG", "LONG", "PONG", "TONG",
            "GAMES", "GAMER", "GAMED", "GAMIN", "GAMIC", "GAMAY", "GAMBA", "GAMMA", "GAMUT", "GANGS", 
            "GASES", "GASPS", "GATED", "GATES", "GATOR", "GAUGE", "GAUNT", "GAUZE", "GAVEL", "GAWKS",
            "GEARS", "GECKO", "GEEKS", "GEESE", "GENES", "GENIE", "GENUS", "GEODE", "GHOST", "GHOUL",
            "GIANT", "GIDDY", "GIFTS", "GILLS", "GIRLS", "GIVEN", "GIVES", "GIZMO", "GLADE", "GLAND",
            "GLARE", "GLASS", "GLAZE", "GLEAM", "GLEAN", "GLIDE", "GLOAT", "GLOBE", "GLOOM", "GLORY",
            "GLOSS", "GLOVE", "GLOWS", "GLUED", "GLUES", "GNASH", "GNATS", "GNOME", "GOALS", "GOATS",
            "GOING", "GOLDS", "GOLEM", "GOLFS", "GONER", "GONGS", "GOODS", "GOODY", "GOOEY", "GOOFS",
            "GOOSE", "GORGE", "GOTHS", "GOUGE", "GOURD", "GOWNS", "GRABS", "GRACE", "GRADE", "GRADS",
            "GRAFT", "GRAIL", "GRAIN", "GRAND", "GRANT", "GRAPE", "GRAPH", "GRASP", "GRASS", "GRATE",
            "GRAVE", "GRAVY", "GRAYS", "GRAZE", "GREAT", "GREED", "GREEK", "GREEN", "GREET", "GREYS",
            "GRIEF", "GRILL", "GRIME", "GRIMY", "GRIND", "GRINS", "GRIPE", "GRIPS", "GRIST", "GROAN",
            "GROIN", "GROOM", "GROPE", "GROSS", "GROUP", "GROUT", "GROVE", "GROWL", "GROWN", "GROWS",
            "GRUBS", "GRUEL", "GRUFF", "GRUMP", "GRUNT", "GUANO", "GUARD", "GUAVA", "GUESS", "GUEST",
            "GUIDE", "GUILD", "GUILE", "GUILT", "GUISE", "GULCH", "GULFS", "GULLS", "GULLY", "GULPS",
            "GUMBO", "GUMMY", "GUPPY", "GURUS", "GUSHY", "GUSTO", "GUSTS", "GUTSY", "GYPSY"
        ]);

        const WORD_LENGTH = 5;
        const MAX_GUESSES = 6;
        
        let gameState = 'setup'; // 'setup', 'playing', 'won', 'lost'
        let secretWord = '';
        let guesses = Array(MAX_GUESSES).fill('');
        let currentRowIndex = 0;
        let currentGuess = '';

        // DOM Elements
        const setupView = document.getElementById('setup-view');
        const setupInput = document.getElementById('setup-input');
        const setupError = document.getElementById('setup-error');
        const startBtn = document.getElementById('start-btn');
        const board = document.getElementById('board');
        const keyboard = document.getElementById('keyboard');
        const resetBtn = document.getElementById('reset-btn');
        const toastContainer = document.getElementById('toast-container');

        // --- Setup Phase Logic ---
        
        setupInput.addEventListener('input', (e) => {
            // Force uppercase and remove non-letters
            let val = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
            e.target.value = val;
            
            if (val.length === WORD_LENGTH) {
                if (VALID_WORDS.has(val)) {
                    setupError.style.opacity = '0';
                    startBtn.disabled = false;
                    startBtn.classList.remove('opacity-50', 'bg-[#818384]', 'cursor-not-allowed');
                    startBtn.classList.add('bg-[#538d4e]', 'hover:bg-[#43723f]', 'cursor-pointer');
                } else {
                    setupError.textContent = "Not in word list";
                    setupError.style.opacity = '1';
                    startBtn.disabled = true;
                    resetStartButton();
                }
            } else {
                setupError.style.opacity = '0';
                startBtn.disabled = true;
                resetStartButton();
            }
        });

        setupInput.addEventListener('keydown', (e) => {
             if (e.key === 'Enter' && !startBtn.disabled) {
                 startGame();
             }
        });

        function resetStartButton() {
            startBtn.classList.add('opacity-50', 'bg-[#818384]', 'cursor-not-allowed');
            startBtn.classList.remove('bg-[#538d4e]', 'hover:bg-[#43723f]', 'cursor-pointer');
        }

        startBtn.addEventListener('click', startGame);

        function startGame() {
            secretWord = setupInput.value.toUpperCase();
            setupView.classList.add('hidden');
            gameState = 'playing';
            initializeBoard();
            document.activeElement.blur(); // Remove focus from input to avoid accidental typing
            showToast("Player 2: Start Guessing!", 2500);
        }

        // --- Game Board Logic ---
        
        function initializeBoard() {
            board.innerHTML = '';
            for (let i = 0; i < MAX_GUESSES; i++) {
                const row = document.createElement('div');
                row.className = 'row grid grid-cols-5 gap-[5px] w-full h-full';
                row.id = `row-${i}`;
                
                for (let j = 0; j < WORD_LENGTH; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.id = `tile-${i}-${j}`;
                    tile.dataset.state = 'empty';
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }
        }

        // --- Input Handling ---

        function handleInput(key) {
            if (gameState !== 'playing') return;

            if (key === 'ENTER') {
                submitGuess();
            } else if (key === 'BACKSPACE') {
                deleteLetter();
            } else if (/^[A-Z]$/.test(key)) {
                addLetter(key);
            }
        }

        function addLetter(letter) {
            if (currentGuess.length < WORD_LENGTH) {
                currentGuess += letter;
                updateGrid();
            }
        }

        function deleteLetter() {
            if (currentGuess.length > 0) {
                currentGuess = currentGuess.slice(0, -1);
                updateGrid();
            }
        }

        function updateGrid() {
            const row = document.getElementById(`row-${currentRowIndex}`);
            const tiles = row.querySelectorAll('.tile');
            
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = tiles[i];
                if (i < currentGuess.length) {
                    tile.textContent = currentGuess[i];
                    tile.dataset.state = 'tbd';
                } else {
                    tile.textContent = '';
                    tile.dataset.state = 'empty';
                    // Remove animation class if letter is deleted
                    tile.style.animation = 'none'; 
                    tile.offsetHeight; /* trigger reflow */
                    tile.style.animation = null; 
                }
            }
        }

        function submitGuess() {
            if (currentGuess.length !== WORD_LENGTH) {
                showToast("Not enough letters");
                shakeRow();
                return;
            }

            if (!VALID_WORDS.has(currentGuess)) {
                showToast("Not in word list");
                shakeRow();
                return;
            }

            const row = document.getElementById(`row-${currentRowIndex}`);
            const tiles = row.querySelectorAll('.tile');
            const guessArray = currentGuess.split('');
            const targetArray = secretWord.split('');
            const statuses = Array(WORD_LENGTH).fill('absent');

            // Evaluate guess (Pass 1: Correct)
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (guessArray[i] === targetArray[i]) {
                    statuses[i] = 'correct';
                    targetArray[i] = null;
                    guessArray[i] = null;
                }
            }

            // Evaluate guess (Pass 2: Present)
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (guessArray[i] !== null && targetArray.includes(guessArray[i])) {
                    statuses[i] = 'present';
                    targetArray[targetArray.indexOf(guessArray[i])] = null;
                }
            }

            gameState = 'animating'; // Lock input during animation
            
            // Animate tiles
            tiles.forEach((tile, index) => {
                setTimeout(() => {
                    tile.dataset.animation = 'flip-in';
                    
                    tile.addEventListener('animationend', () => {
                        if(tile.dataset.animation === 'flip-in') {
                             // Middle of flip: update colors
                             tile.dataset.state = statuses[index];
                             tile.dataset.animation = 'flip-out';
                             updateKeyboard(currentGuess[index], statuses[index]);
                        } else if (tile.dataset.animation === 'flip-out') {
                             tile.removeAttribute('data-animation');
                             
                             // If it's the last tile finishing animation
                             if (index === WORD_LENGTH - 1) {
                                 finalizeGuess(currentGuess === secretWord);
                             }
                        }
                    }, {once: false}); // Note: event listener logic handles the dual states
                    
                }, index * 250); // Stagger animation
            });
        }

        function finalizeGuess(isWin) {
            guesses[currentRowIndex] = currentGuess;
            
            if (isWin) {
                gameState = 'won';
                setTimeout(() => showToast(getWinMessage(currentRowIndex), 5000), 500);
            } else if (currentRowIndex === MAX_GUESSES - 1) {
                gameState = 'lost';
                setTimeout(() => showToast(secretWord, 10000), 500);
            } else {
                currentRowIndex++;
                currentGuess = '';
                gameState = 'playing';
            }
        }

        function updateKeyboard(letter, status) {
            const keyBtn = document.querySelector(`.key[data-key="${letter.toLowerCase()}"]`);
            if (!keyBtn) return;

            const currentStatus = keyBtn.dataset.state;
            
            if (status === 'correct' || currentStatus === 'correct') {
                keyBtn.dataset.state = 'correct';
            } else if (status === 'present' && currentStatus !== 'correct') {
                keyBtn.dataset.state = 'present';
            } else if (status === 'absent' && !currentStatus) {
                keyBtn.dataset.state = 'absent';
            }
        }

        function shakeRow() {
            const row = document.getElementById(`row-${currentRowIndex}`);
            row.classList.remove('shake');
            void row.offsetWidth; // trigger reflow
            row.classList.add('shake');
            setTimeout(() => row.classList.remove('shake'), 500);
        }

        // --- Helpers ---

        function showToast(message, duration = 2000) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.className = 'toast-message';
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => {
                    if (toastContainer.contains(toast)) {
                        toastContainer.removeChild(toast);
                    }
                }, 300); // Matches CSS transition duration
            }, duration);
        }
        
        function getWinMessage(attempts) {
            const messages = ["Genius", "Magnificent", "Impressive", "Splendid", "Great", "Phew"];
            return messages[attempts] || "You got it!";
        }

        // Reset Game
        resetBtn.addEventListener('click', () => {
            // Reset State
            gameState = 'setup';
            secretWord = '';
            guesses = Array(MAX_GUESSES).fill('');
            currentRowIndex = 0;
            currentGuess = '';
            
            // Reset UI
            setupInput.value = '';
            setupError.style.opacity = '0';
            startBtn.disabled = true;
            resetStartButton();
            setupView.classList.remove('hidden');
            
            board.innerHTML = '';
            
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => key.removeAttribute('data-state'));
            
            toastContainer.innerHTML = '';
        });

        // Event Listeners
        document.addEventListener('keydown', (e) => {
            if (gameState === 'setup' || gameState === 'animating') return;
            
            if (e.key === 'Enter') handleInput('ENTER');
            else if (e.key === 'Backspace') handleInput('BACKSPACE');
            else if (e.key.match(/^[a-zA-Z]$/)) handleInput(e.key.toUpperCase());
        });

        keyboard.addEventListener('click', (e) => {
            if (gameState === 'setup' || gameState === 'animating') return;
            
            const keyBtn = e.target.closest('.key');
            if (keyBtn) {
                const key = keyBtn.dataset.key.toUpperCase();
                handleInput(key);
                
                // Remove focus to prevent Enter key triggering the last clicked button
                keyBtn.blur();
            }
        });

    </script>
</body>
</html>
